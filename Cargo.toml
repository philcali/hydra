[workspace]
members = [
    "crates/hydra",
    "crates/hydra-auth",
    "crates/hydra-api",
    "crates/hydra-catalog",
    "crates/hydra-discovery",
    "crates/hydra-drivers",
    "crates/hydra-telemetry",
    "crates/hydra-audit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mbse = { path = "../mbse-verify/crates/mbse" }
mbse-graph = { path = "../mbse-verify/crates/mbse-graph" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = true
